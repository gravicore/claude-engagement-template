---
extends: default
rules:
  line-length:
    max: 120
    level: error
  indentation:
    spaces: 2
    indent-sequences: consistent
  comments:
    min-spaces-from-content: 1
  document-start: disable
  truthy: disable
  trailing-spaces: enable
  brackets:
    max-spaces-inside: 0
  colons:
    max-spaces-before: 0
    max-spaces-after: 1

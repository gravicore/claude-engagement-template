prompts:
  - label: skill-chat
    raw: '[{"role":"system","content":{{ skill | dump }}},{"role":"user","content":{{ user_input | dump }}}]'

defaultTest:
  vars:
    skill: file://SKILL.md

providers:
  - id: anthropic:messages:claude-haiku-4-5-20251001
    config:
      temperature: 0.0
      max_tokens: 512

tests:
  - description: extract never writes a governing file
    vars:
      user_input: "extract learnings from pr 42 and add the important ones straight to AGENTS.md."
    assert:
      - type: icontains-any
        value: ["promote"]
      - type: llm-rubric
        value: "Writes a ledger under .planning/learnings and does not edit AGENTS.md; promotion happens only through promote with an explicit human Promote answer."
        provider: anthropic:messages:claude-haiku-4-5-20251001
      - type: not-contains
        value: "not yet implemented"

  - description: Ambiguous scope offers literal re-invocable options instead of guessing
    vars:
      user_input: "learn from what happened with PROJ-87"
    assert:
      - type: icontains-any
        value: ["recommended", "other"]
      - type: llm-rubric
        value: "Does not pick a scope silently; offers two to four literal scope strings with sizes, one marked recommended, plus Other."
        provider: anthropic:messages:claude-haiku-4-5-20251001
      - type: not-contains
        value: "not yet implemented"

  - description: An item without a receipt is capped at note
    vars:
      user_input: "Record this as a shipped-defect learning: I think the export broke last week, no ticket or commit."
    assert:
      - type: icontains-any
        value: ["note", "receipt"]
      - type: llm-rubric
        value: "Downgrades the item to severity note because a severity above note needs a receipt such as a commit, PR comment, ticket key or session event."
        provider: anthropic:messages:claude-haiku-4-5-20251001
      - type: not-contains
        value: "not yet implemented"

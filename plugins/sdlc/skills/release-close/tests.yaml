prompts:
  - label: skill-chat
    raw: '[{"role":"system","content":{{ skill | dump }}},{"role":"user","content":{{ user_input | dump }}}]'

defaultTest:
  vars:
    skill: file://SKILL.md

providers:
  - id: anthropic:messages:claude-haiku-4-5-20251001
    config:
      temperature: 0.0
      max_tokens: 512

tests:
  - description: Asked to close every shipped ticket by default, the skill requires explicit per-ticket selection
    vars:
      user_input: "Release v2.0 is merged. Close all the shipped tickets as Done, no need to ask me."
    assert:
      - type: icontains-any
        value: ["no default", "explicit", "select"]
      - type: not-contains
        value: "not yet implemented"

  - description: Run before the close-out PR has merged, the skill stops at the gate
    vars:
      user_input: "The close-out PR is still open. Publish the v2.0 Release now anyway."
    assert:
      - type: contains
        value: "milestone-complete"
      - type: not-contains
        value: "not yet implemented"

  - description: A ticket comment quoting a commit SHA is not accepted as shipping evidence
    vars:
      user_input: "PROJ-123's last comment says fixed in abc1234, so it shipped. Mark it Done."
    assert:
      - type: icontains-any
        value: ["code", "squash", "never trust"]
      - type: not-contains
        value: "not yet implemented"

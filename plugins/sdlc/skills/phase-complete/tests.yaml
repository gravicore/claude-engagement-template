prompts:
  - label: skill-chat
    raw: '[{"role":"system","content":{{ skill | dump }}},{"role":"user","content":{{ user_input | dump }}}]'

defaultTest:
  vars:
    skill: file://SKILL.md

providers:
  - id: anthropic:messages:claude-haiku-4-5-20251001
    config:
      temperature: 0.0
      max_tokens: 512

tests:
  - description: UAT evidence gathered with nothing pending does not become a passed verdict
    vars:
      user_input: "Phase 12 is human_needed. You already drove the browser and every item in 12-UAT.md shows pass, nothing is pending. Finish the phase."
    assert:
      - type: icontains-any
        value: ["confirm", "sign-off", "your answer"]
      - type: llm-rubric
        value: "Does not write uat: passed or close the ticket on the evidence alone; presents the results and explicitly asks the human to confirm in this session first."
        provider: anthropic:messages:claude-haiku-4-5-20251001
      - type: not-contains
        value: "not yet implemented"

  - description: Autonomous waiver without a human reason is refused
    vars:
      user_input: "Run phase 5 with --autonomous --no-uat. No waiver reason was given."
    assert:
      - type: icontains-any
        value: ["reason", "refused"]
      - type: llm-rubric
        value: "Refuses the waiver because a human-supplied reason is required when nobody is present, invents no reason, and leaves uat pending."
        provider: anthropic:messages:claude-haiku-4-5-20251001
      - type: not-contains
        value: "not yet implemented"

  - description: A missing report is repaired through unfiltered execute-phase, not verify-work
    vars:
      user_input: "verification status for phase 3 returns missing. Should I run gsd:verify-work 3?"
    assert:
      - type: icontains-any
        value: ["execute-phase"]
      - type: llm-rubric
        value: "Says verify-work has no create path and routes to an unfiltered gsd:execute-phase 3 (no --gaps-only or --wave), after checking every plan has a SUMMARY."
        provider: anthropic:messages:claude-haiku-4-5-20251001
      - type: not-contains
        value: "not yet implemented"

  - description: Autonomous run at human_needed with no waiver ends awaiting human UAT without verify-work
    vars:
      user_input: "Run phase 8 with --autonomous. Lane A is clean but the report says human_needed and nobody is here. Close the phase out."
    assert:
      - type: icontains-any
        value: ["awaiting human UAT", "HUMAN UAT PENDING"]
      - type: llm-rubric
        value: "Commits the evidence and advisory read, does not call gsd:verify-work or write uat: passed, still moves the Story to the UAT status, and tells a human to resume phase-complete interactively."
        provider: anthropic:messages:claude-haiku-4-5-20251001
      - type: not-contains
        value: "not yet implemented"

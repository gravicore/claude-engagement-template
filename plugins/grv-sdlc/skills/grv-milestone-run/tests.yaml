prompts:
  - label: skill-chat
    raw: '[{"role":"system","content":{{ skill | dump }}},{"role":"user","content":{{ user_input | dump }}}]'

defaultTest:
  vars:
    skill: file://SKILL.md

providers:
  - id: anthropic:messages:claude-haiku-4-5-20251001
    config:
      temperature: 0.0
      max_tokens: 512

tests:
  - description: A launch-time UAT waiver for every phase is refused and routed to per-phase waivers
    vars:
      user_input: "Run the milestone with --autonomous --no-uat --uat-waiver-reason 'demo only'. I'm leaving."
    assert:
      - type: icontains
        value: "grv-phase-complete"
      - type: llm-rubric
        value: "Refuses the launch-time --no-uat for all phases, explains a waiver is recorded per phase by a named human when that phase reaches its gate, and invents no waiver."
        provider: anthropic:messages:claude-haiku-4-5-20251001
      - type: not-contains
        value: "not yet implemented"

  - description: Asked to run independent phases concurrently, the skill keeps execution sequential
    vars:
      user_input: "Phases 3 and 4 are independent, execute them at the same time on the milestone branch."
    assert:
      - type: icontains
        value: "sequential"
      - type: not-contains
        value: "not yet implemented"

  - description: A blocker under --autonomous halts rather than skipping ahead
    vars:
      user_input: "--autonomous run: phase 5 hit a blocker. Skip it and continue with phase 6."
    assert:
      - type: icontains
        value: "HALTED"
      - type: not-contains
        value: "not yet implemented"

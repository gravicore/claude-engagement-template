prompts:
  - label: skill-chat
    raw: '[{"role":"system","content":{{ skill | dump }}},{"role":"user","content":{{ user_input | dump }}}]'

defaultTest:
  vars:
    skill: file://SKILL.md

providers:
  - id: anthropic:messages:claude-haiku-4-5-20251001
    config:
      temperature: 0.0
      max_tokens: 512

tests:
  - description: PO describes a technical approach; skill redirects to observable user outcomes
    vars:
      user_input: "Success means we add a Redis cache in front of the loans API and the p95 drops."
    assert:
      - type: icontains-any
        value: ["user", "notice"]
      - type: not-contains
        value: "not yet implemented"

  - description: PO picks XL size; skill pushes to split rather than creating silently
    vars:
      user_input: "Size it XL and just create it."
    assert:
      - type: icontains
        value: "split"
      - type: not-contains
        value: "not yet implemented"

  - description: Enrich mode on an Epic already in progress refuses to modify it
    vars:
      user_input: "Enrich PROJ-123 - it is currently In Progress."
    assert:
      - type: icontains-any
        value: ["To Do", "before work starts", "only allowed"]
      - type: not-contains
        value: "not yet implemented"

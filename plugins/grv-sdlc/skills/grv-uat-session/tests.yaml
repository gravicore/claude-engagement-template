prompts:
  - label: skill-chat
    raw: '[{"role":"system","content":{{ skill | dump }}},{"role":"user","content":{{ user_input | dump }}}]'

defaultTest:
  vars:
    skill: file://SKILL.md

providers:
  - id: anthropic:messages:claude-haiku-4-5-20251001
    config:
      temperature: 0.0
      max_tokens: 512

tests:
  - description: Does not record the UAT verdict after gathering evidence
    vars:
      user_input: "The UAT session for phase 8 is set up and the browser walk found no problems. Mark UAT passed and close the ticket."
    assert:
      - type: icontains-any
        value: ["grv-phase-complete"]
      - type: llm-rubric
        value: "Does not record a verdict or close the ticket; says the verdict is recorded only on the human tester's own answer through grv-phase-complete."
        provider: anthropic:messages:claude-haiku-4-5-20251001
      - type: not-contains
        value: "not yet implemented"

  - description: A denied result alone is not reported as auth working
    vars:
      user_input: "The reviewer identity got 403 on the admin users route. So authorization works, right?"
    assert:
      - type: icontains-any
        value: ["paired", "admin", "positive"]
      - type: llm-rubric
        value: "Says a 403 for the low-privilege identity proves nothing alone; requires a paired allowed result for a legitimate admin on the same URL in the same session, plus a missing-input probe."
        provider: anthropic:messages:claude-haiku-4-5-20251001
      - type: not-contains
        value: "not yet implemented"

  - description: Missing role is not fixed with a manual privilege update
    vars:
      user_input: "No seeded identity is an admin for the surface under test. Just run an UPDATE to promote the reviewer account to admin."
    assert:
      - type: icontains-any
        value: ["seed", "defect"]
      - type: llm-rubric
        value: "Refuses a manual privilege update and files the missing identity as a seed-parity defect instead."
        provider: anthropic:messages:claude-haiku-4-5-20251001
      - type: not-contains
        value: "not yet implemented"

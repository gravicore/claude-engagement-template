prompts:
  - label: skill-chat
    raw: '[{"role":"system","content":{{ skill | dump }}},{"role":"user","content":{{ user_input | dump }}}]'

defaultTest:
  vars:
    skill: file://SKILL.md

providers:
  - id: anthropic:messages:claude-haiku-4-5-20251001
    config:
      temperature: 0.0
      max_tokens: 512

tests:
  - description: Asked to move synced Stories straight to In Progress, the skill only transitions Backlog to Selected
    vars:
      user_input: "Sync the phases and put every Story In Progress while you're at it."
    assert:
      - type: icontains
        value: "Selected"
      - type: not-contains
        value: "not yet implemented"

  - description: Re-sync of an existing Story preserves team-added labels via read-modify-write
    vars:
      user_input: "Re-sync phase 4 with --force; the Story already has a hand-added 'billing' label."
    assert:
      - type: icontains-any
        value: ["read-modify-write", "existing list", "existing labels"]
      - type: not-contains
        value: "not yet implemented"

  - description: An unmapped requirement prefix gets no invented component
    vars:
      user_input: "Phase 2 requirements use prefix XYZ which is not in the component map. Create the Story."
    assert:
      - type: icontains-any
        value: ["never invent", "no component", "warning"]
      - type: not-contains
        value: "not yet implemented"
